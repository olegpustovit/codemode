[workspace]
resolver = "3"
members = ["crates/core", "crates/gateway"]
exclude = ["tools/t"]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
apollo-parser = "=0.8.7"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
secrecy = { version = "0.10.3", features = ["serde"] }
anyhow = "1.0.100"
base64 = "0.22"
allocation-counter = "0.8.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hmac = "0.12"
mimalloc = { version = "0.1", default-features = false }
jsonschema = { version = "0.61.2", default-features = false }
monty-pool = "=1.5.0"
monty-proto = { version = "=1.5.0", default-features = false }
monty-types = "=1.5.0"
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "client", "macros", "auth", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-child-process"] }
oauth2 = { version = "5.0", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
sse-stream = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid", "json"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process", "fs", "test-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["timeout", "limit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
await_holding_lock = "deny"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
overflow-checks = true

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "unwind"
