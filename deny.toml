[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Only openidconnect 4.1.0 depends on RSA 0.9.10; ID client verifies public signatures, never RSA private operations. tools/check-dependencies.sh enforces the dependency boundary. Reassess before private operations or library changes; remove when upstream upgrades. See docs/identity-rollout.md." },
]

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CDLA-Permissive-2.0", "OpenSSL"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
